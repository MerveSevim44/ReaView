<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akış • BiblioNet</title>

  <!-- Base theme and variables -->
  <link rel="stylesheet" href="./css/style.css" />
  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="./css/feed.css?v=20260817e" />
  <link rel="stylesheet" href="./css/navbar.css?v=20260817b" />
</head>

<body>
  <!-- Navbar otomatik olarak eklenecek -->

  <!-- Main Content -->
  <main id="main-content">
    <div id="feed-container">
      <div class="loading">Yükleniyor...</div>
    </div>
    <div id="load-more-container" style="display: none;">
      <button class="btn-load-more" id="load-more-btn">Daha Fazla Yükle</button>
    </div>
  </main>

  <!-- Modal: Beğenenleri Göster -->
  <div id="likes-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>❤️ Beğenenler</h2>
        <button class="modal-close" onclick="document.getElementById('likes-modal').style.display = 'none'">✕</button>
      </div>
      <div class="modal-body" id="likes-modal-body">
        <p style="text-align: center; color: #999;">Yükleniyor...</p>
      </div>
    </div>
  </div>

  <!-- Load Navbar Module -->
  <script type="module" src="./js/components/navbar.js?v=20260817b"></script>

  <!-- Load Feed Module -->
  <script type="module" src="./js/pages/feed-page.js"></script>
</body>

</html>
